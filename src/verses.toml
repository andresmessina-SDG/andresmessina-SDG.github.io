# The verse under the maker's name changes each day, in the reader's own browser:
# day 0 is 1 January 2026, and the days go round this list in order. The first is the
# one the page is built with, and the one shown when scripts are off.
# English from the King James Version; Spanish from the Reina-Valera 1960.
# Write "LORD" as the KJV prints it; the page sets it in small capitals.

[[verses]]
en = "Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God."
en_ref = "1 Corinthians 10:31"
es = "Si, pues, coméis o bebéis, o hacéis otra cosa, hacedlo todo para la gloria de Dios."
es_ref = "1 Corintios 10:31"

[[verses]]
en = "God is our refuge and strength, a very present help in trouble."
en_ref = "Psalm 46:1"
es = "Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones."
es_ref = "Salmo 46:1"

[[verses]]
en = "And whatsoever ye do, do it heartily, as to the Lord, and not unto men; knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ."
en_ref = "Colossians 3:23–24"
es = "Y todo lo que hagáis, hacedlo de corazón, como para el Señor y no para los hombres; sabiendo que del Señor recibiréis la recompensa de la herencia, porque a Cristo el Señor servís."
es_ref = "Colosenses 3:23–24"

[[verses]]
en = "Thy word is a lamp unto my feet, and a light unto my path."
en_ref = "Psalm 119:105"
es = "Lámpara es a mis pies tu palabra, y lumbrera a mi camino."
es_ref = "Salmo 119:105"

[[verses]]
en = "For of him, and through him, and to him, are all things: to whom be glory for ever. Amen."
en_ref = "Romans 11:36"
es = "Porque de él, y por él, y para él, son todas las cosas. A él sea la gloria por los siglos. Amén."
es_ref = "Romanos 11:36"

[[verses]]
en = "One generation shall praise thy works to another, and shall declare thy mighty acts."
en_ref = "Psalm 145:4"
es = "Generación a generación celebrará tus obras, y anunciará tus poderosos hechos."
es_ref = "Salmo 145:4"

[[verses]]
en = "The grass withereth, the flower fadeth: but the word of our God shall stand for ever."
en_ref = "Isaiah 40:8"
es = "Sécase la hierba, marchítase la flor; mas la palabra del Dios nuestro permanece para siempre."
es_ref = "Isaías 40:8"

[[verses]]
en = "But now they desire a better country, that is, an heavenly: wherefore God is not ashamed to be called their God: for he hath prepared for them a city."
en_ref = "Hebrews 11:16"
es = "Pero anhelaban una mejor, esto es, celestial; por lo cual Dios no se avergüenza de llamarse Dios de ellos; porque les ha preparado una ciudad."
es_ref = "Hebreos 11:16"

[[verses]]
en = "The heavens declare the glory of God; and the firmament sheweth his handywork."
en_ref = "Psalm 19:1"
es = "Los cielos cuentan la gloria de Dios, y el firmamento anuncia la obra de sus manos."
es_ref = "Salmo 19:1"

[[verses]]
en = "The fear of the LORD is the beginning of wisdom: and the knowledge of the holy is understanding."
en_ref = "Proverbs 9:10"
es = "El temor de Jehová es el principio de la sabiduría, y el conocimiento del Santísimo es la inteligencia."
es_ref = "Proverbios 9:10"

[[verses]]
en = "And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."
en_ref = "John 1:14"
es = "Y aquel Verbo fue hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad."
es_ref = "Juan 1:14"

[[verses]]
en = "There is a river, the streams whereof shall make glad the city of God, the holy place of the tabernacles of the most High."
en_ref = "Psalm 46:4"
es = "Del río sus corrientes alegran la ciudad de Dios, el santuario de las moradas del Altísimo."
es_ref = "Salmo 46:4"

[[verses]]
en = "Beware lest any man spoil you through philosophy and vain deceit, after the tradition of men, after the rudiments of the world, and not after Christ."
en_ref = "Colossians 2:8"
es = "Mirad que nadie os engañe por medio de filosofías y huecas sutilezas, según las tradiciones de los hombres, conforme a los rudimentos del mundo, y no según Cristo."
es_ref = "Colosenses 2:8"

[[verses]]
en = "And let the beauty of the LORD our God be upon us: and establish thou the work of our hands upon us; yea, the work of our hands establish thou it."
en_ref = "Psalm 90:17"
es = "Sea la luz de Jehová nuestro Dios sobre nosotros, y la obra de nuestras manos confirma sobre nosotros; sí, la obra de nuestras manos confirma."
es_ref = "Salmo 90:17"

[[verses]]
en = "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: not of works, lest any man should boast."
en_ref = "Ephesians 2:8–9"
es = "Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios; no por obras, para que nadie se gloríe."
es_ref = "Efesios 2:8–9"

[[verses]]
en = "One thing have I desired of the LORD, that will I seek after; that I may dwell in the house of the LORD all the days of my life, to behold the beauty of the LORD, and to enquire in his temple."
en_ref = "Psalm 27:4"
es = "Una cosa he demandado a Jehová, ésta buscaré; que esté yo en la casa de Jehová todos los días de mi vida, para contemplar la hermosura de Jehová, y para inquirir en su templo."
es_ref = "Salmo 27:4"

[[verses]]
en = "And he that sat upon the throne said, Behold, I make all things new. And he said unto me, Write: for these words are true and faithful."
en_ref = "Revelation 21:5"
es = "Y el que estaba sentado en el trono dijo: He aquí, yo hago nuevas todas las cosas. Y me dijo: Escribe; porque estas palabras son fieles y verdaderas."
es_ref = "Apocalipsis 21:5"

[[verses]]
en = "In the beginning God created the heaven and the earth."
en_ref = "Genesis 1:1"
es = "En el principio creó Dios los cielos y la tierra."
es_ref = "Génesis 1:1"

[[verses]]
en = "Blessed is the man whose strength is in thee; in whose heart are the ways of them."
en_ref = "Psalm 84:5"
es = "Bienaventurado el hombre que tiene en ti sus fuerzas, en cuyo corazón están tus caminos."
es_ref = "Salmo 84:5"

[[verses]]
en = "For I am not ashamed of the gospel of Christ: for it is the power of God unto salvation to every one that believeth; to the Jew first, and also to the Greek."
en_ref = "Romans 1:16"
es = "Porque no me avergüenzo del evangelio, porque es poder de Dios para salvación a todo aquel que cree; al judío primeramente, y también al griego."
es_ref = "Romanos 1:16"

[[verses]]
en = "We will not hide them from their children, shewing to the generation to come the praises of the LORD, and his strength, and his wonderful works that he hath done."
en_ref = "Psalm 78:4"
es = "No las encubriremos a sus hijos, contando a la generación venidera las alabanzas de Jehová, y su potencia, y las maravillas que hizo."
es_ref = "Salmo 78:4"

[[verses]]
en = "Not unto us, O LORD, not unto us, but unto thy name give glory, for thy mercy, and for thy truth’s sake."
en_ref = "Psalm 115:1"
es = "No a nosotros, oh Jehová, no a nosotros, sino a tu nombre da gloria, por tu misericordia, por tu verdad."
es_ref = "Salmo 115:1"

[[verses]]
en = "O sing unto the LORD a new song: sing unto the LORD, all the earth."
en_ref = "Psalm 96:1"
es = "Cantad a Jehová cántico nuevo; cantad a Jehová, toda la tierra."
es_ref = "Salmo 96:1"

[[verses]]
en = "Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth."
en_ref = "Psalm 46:10"
es = "Estad quietos, y conoced que yo soy Dios; seré exaltado entre las naciones; enaltecido seré en la tierra."
es_ref = "Salmo 46:10"

[[verses]]
en = "He which testifieth these things saith, Surely I come quickly. Amen. Even so, come, Lord Jesus."
en_ref = "Revelation 22:20"
es = "El que da testimonio de estas cosas dice: Ciertamente vengo en breve. Amén; sí, ven, Señor Jesús."
es_ref = "Apocalipsis 22:20"

[[verses]]
en = "Let every thing that hath breath praise the LORD. Praise ye the LORD."
en_ref = "Psalm 150:6"
es = "Todo lo que respira alabe a JAH. Aleluya."
es_ref = "Salmo 150:6"
