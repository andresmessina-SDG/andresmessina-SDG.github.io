bach = "Bach encabezaba sus partituras con J.J., «Jesús, ayúdame», y las firmaba S.D.G., «solo a Dios la gloria». Este libro toma prestada su costumbre, y sus pentagramas llevan su arreglo del *Ein feste Burg ist unser Gott* de Lutero, BWV 302, una línea en cada página, con la letra castellana de Juan Bautista Cabrera; pulsa una para oírla a cuatro voces. Su nombre también es una melodía: en alemán, B es si\u00a0bemol y H es si\u00a0natural."
