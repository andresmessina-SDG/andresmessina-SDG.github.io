lede = "I am a Christian who loves to learn and build to the glory of God. These are five free works I have made: a Bible study app with the Greek and Hebrew under every word; twenty-two worldviews, each painted in watercolor as an answer to four great questions; the church’s story from Pentecost to today, drawn as one river; a game that teaches students the story and beliefs of Christianity; and an illuminated guide to the Book of Revelation."
